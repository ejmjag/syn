const S=[["Синоним деген не?", "Synonyms", "Синонимдер — мағынасы ұқсас, бірақ қолданылу аясы мен реңкі әртүрлі сөздер. Олар әр контексте толық алмастырыла бермейді.", [["big / large", "үлкен", "a big problem / a large building", "үлкен мәселе / үлкен ғимарат"], ["begin / start", "бастау", "The lesson begins at nine.", "Сабақ тоғызда басталады."], ["smart / intelligent", "ақылды", "She is an intelligent student.", "Ол ақылды студент."], ["happy / glad / delighted", "қуанышты", "I am delighted to meet you.", "Танысқаныма өте қуаныштымын."]]], ["Мағыналық реңк және күш", "Intensity", "Синонимдер сезімнің немесе сапаның дәрежесін әртүрлі білдіреді. Сөзді таңдағанда қарқындылықты ескеріңіз.", [["tired → exhausted", "шаршаған → әбден қалжыраған", "After the marathon, he was exhausted.", "Марафоннан кейін ол әбден қалжырады."], ["angry → furious", "ашулы → қатты ашулы", "She was furious about the delay.", "Ол кешігуге қатты ашуланды."], ["good → excellent", "жақсы → өте жақсы", "Your results are excellent.", "Нәтижелерің өте жақсы."], ["afraid → terrified", "қорыққан → қатты үрейленген", "The child was terrified.", "Бала қатты қорықты."]]], ["Ресми және бейресми стиль", "Register", "Бір мағынаны білдіретін сөздердің ресмилік дәрежесі әртүрлі болуы мүмкін. Академиялық мәтінде ресми баламалар жиі кездеседі.", [["buy / purchase", "сатып алу", "The company purchased new equipment.", "Компания жаңа жабдық сатып алды."], ["help / assist", "көмектесу", "The assistant will assist you.", "Көмекші сізге көмектеседі."], ["ask / inquire", "сұрау", "Please inquire at reception.", "Қабылдау бөліміне хабарласыңыз."], ["get / obtain", "алу, қол жеткізу", "You must obtain permission.", "Сіз рұқсат алуыңыз керек."]]], ["Контекст және тіркесімділік", "Collocations", "Синонимдерді таңдағанда сөздердің табиғи тіркесіміне назар аударыңыз. Бір сөз екіншісінің орнына барлық тіркесте келе бермейді.", [["make a decision", "шешім қабылдау", "We must make a decision today.", "Бүгін шешім қабылдауымыз керек."], ["strong coffee", "қою кофе", "He likes strong coffee.", "Ол қою кофені ұнатады."], ["heavy rain", "нөсер жаңбыр", "Heavy rain delayed the train.", "Нөсер жаңбыр пойызды кешіктірді."], ["deep sleep", "қатты ұйқы", "The baby was in a deep sleep.", "Нәресте қатты ұйықтап жатты."]]], ["Антоним деген не?", "Antonyms", "Антонимдер — мағыналары қарама-қарсы сөздер. Олар сапа, әрекет, бағыт, уақыт және басқа белгілерді қарсы қояды.", [["hot / cold", "ыстық / суық", "The water is hot, not cold.", "Су суық емес, ыстық."], ["accept / reject", "қабылдау / қабылдамау", "They rejected the proposal.", "Олар ұсынысты қабылдамады."], ["increase / decrease", "арту / азаю", "Prices may decrease next month.", "Бағалар келесі айда төмендеуі мүмкін."], ["ancient / modern", "ежелгі / заманауи", "This is a modern building.", "Бұл заманауи ғимарат."]]], ["Градациялық антонимдер", "Gradable opposites", "Қарама-қарсы екі сапаның арасында аралық дәрежелер болуы мүмкін: hot–warm–cool–cold.", [["rich / poor", "бай / кедей", "The region is neither rich nor poor.", "Аймақ бай да, кедей де емес."], ["young / old", "жас / кәрі", "My grandfather is old but active.", "Атам қарт болса да белсенді."], ["easy / difficult", "оңай / қиын", "The task is rather difficult.", "Тапсырма едәуір қиын."], ["wide / narrow", "кең / тар", "The street is narrow.", "Көше тар."]]], ["Толық қарама-қарсылық", "Complementary opposites", "Кейбір жұптарда аралық мағына болмайды: alive/dead, present/absent. Дегенмен күнделікті тілде ауыспалы қолданыстар кездесуі мүмкін.", [["alive / dead", "тірі / өлі", "The plant is still alive.", "Өсімдік әлі тірі."], ["true / false", "шын / жалған", "The statement is false.", "Тұжырым жалған."], ["legal / illegal", "заңды / заңсыз", "Parking here is illegal.", "Мұнда көлік қою заңсыз."], ["present / absent", "қатысқан / қатыспаған", "Three students were absent.", "Үш студент сабақта болмады."]]], ["Өзара қатынасты антонимдер", "Relational opposites", "Бір қатынастың екі бағыты Темекі шегуге рұқсат жоқ."], ["arrive / depart", "келу / кету", "The train departed on time.", "Пойыз уақытында жөнелді."], ["build / destroy", "салу / қирату", "The storm destroyed the bridge.", "Дауыл көпірді қиратты."]]], ["Сын есімдер мен үстеулер", "Adjectives & adverbs", "Сын есім зат есімді, үстеу көбіне етістікті, сын есімді немесе басқа үстеуді анықтайды. Синоним таңдауда сөз табы сәйкес келуі тиіс.", [["quick / rapid", "жылдам", "There was rapid growth.", "Жылдам өсім болды."], ["quickly / rapidly", "жылдам түрде", "The population grew rapidly.", "Халық саны тез өсті."], ["careful / careless", "мұқият / ұқыпсыз", "Be careful with the glass.", "Әйнекпен абай бол."], ["often / rarely", "жиі / сирек", "She rarely eats out.", "Ол сыртта сирек тамақтанады."]]]],Q=[{"q": "«give» сөзінің осы бөлімдегі жұбы қайсы?", "opts": ["receive", "because", "always", "therefore"], "a": 0, "why": "give / receive — беру / алу."}, {"q": "«lend» сөзінің осы бөлімдегі жұбы қайсы?", "opts": ["because", "therefore", "borrow", "always"], "a": 2, "why": "lend / borrow — қарызға беру / алу."}, {"q": "«angry → furious» тіркесінің мағынасы қандай?", "opts": ["себеп-салдар", "мекен бағыты", "шартты рай", "ашулы → қатты ашулы"], "a": 3, "why": "angry → furious — ашулы → қатты ашулы. Мысал: She was furious about the delay."}, {"q": "«easy» сөзінің осы бөлімдегі жұбы қайсы?", "opts": ["because", "difficult", "therefore", "always"], "a": 1, "why": "easy / difficult — оңай / қиын."}, {"q": "«good → excellent» тіркесінің мағынасы қандай?", "opts": ["жақсы → өте жақсы", "шартты рай", "мекен бағыты", "себеп-салдар"], "a": 0, "why": "good → excellent — жақсы → өте жақсы. Мысал: Your results are excellent."}, {"q": "«increase» сөзінің осы бөлімдегі жұбы қайсы?", "opts": ["therefore", "because", "decrease", "always"], "a": 2, "why": "increase / decrease — арту / азаю."}, {"q": "«often» сөзінің осы бөлімдегі жұбы қайсы?", "opts": ["always", "therefore", "rarely", "because"], "a": 2, "why": "often /
